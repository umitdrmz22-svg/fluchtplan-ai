name: Fluchtplan Studio auf GitHub Pages bereitstellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-und-bereitstellung:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Prüflogik testen
        run: node tests/rules.test.js
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website-Paket erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
