name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript-Syntax prüfen
        run: |
          node --check public/app.js
          node --check public/app-core.js
          node --check public/cloud-config.js
          node --check public/rules.js
          node --input-type=module --check < public/cloud-bridge.js
      - name: Deploy-Lizenzvertrag prüfen
        run: |
          test -f .github/workflows/ehs-module-gate.yml
          grep -Fq 'defidev-legal/ehs-entitlement-gate.js' .github/workflows/ehs-module-gate.yml
          grep -Fq 'ehs_fluchtplan_monthly' .github/workflows/ehs-module-gate.yml
      - name: Regeltests dreimal ausführen
        run: |
          for PASS in 1 2 3; do echo "QA pass $PASS"; node tests/rules.test.js; done
