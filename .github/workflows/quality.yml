name: Qualitätsprüfung

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-und-regeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript-Syntax prüfen
        run: |
          node --check public/app.js
          node --check public/app-core.js
          node --check public/cloud-config.js
          node --check public/rules.js
          node --input-type=module --check < public/cloud-bridge.js
      - name: Regeltests ausführen
        run: node tests/rules.test.js
